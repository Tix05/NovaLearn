vich_uploader:
    db_driver: orm
    mappings:
        user_avatar:
            uri_prefix: /uploads/avatars
            upload_destination: '%kernel.project_dir%/public/uploads/avatars'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true
        mention_icon:
            uri_prefix: /uploads/icons
            upload_destination: '%kernel.project_dir%/public/uploads/icons'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true
        support_files:
            uri_prefix: /uploads/supports
            upload_destination: '%kernel.project_dir%/public/uploads/supports'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true
        bibliotheque_files:
            uri_prefix: /uploads/bibliotheque
            upload_destination: '%kernel.project_dir%/public/uploads/bibliotheque'
            namer: Vich\UploaderBundle\Naming\UniqidNamer
        correction_file:
            uri_prefix: /uploads/corrections
            upload_destination: '%kernel.project_dir%/public/uploads/corrections'
            namer: Vich\UploaderBundle\Naming\UniqidNamer
            delete_on_update: true
            delete_on_remove: true
            inject_on_load: false
        agenda_image:
            uri_prefix: /uploads/agenda/images
            upload_destination: '%kernel.project_dir%/public/uploads/agenda/images'
            namer: Vich\UploaderBundle\Naming\OrignameNamer
        agenda_video:
            uri_prefix: /uploads/agenda/videos
            upload_destination: '%kernel.project_dir%/public/uploads/agenda/videos'
            namer: Vich\UploaderBundle\Naming\OrignameNamer